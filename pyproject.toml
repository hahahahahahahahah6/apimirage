[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apimirage"
version = "0.1.0"
description = "Catch hallucinated and deprecated API usage: AST scan plus real importlib existence checks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hao li" }]
keywords = ["lint", "static-analysis", "deprecated", "llm", "code-quality", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
apimirage = "apimirage.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/apimirage"

[tool.setuptools.packages.find]
where = ["src"]
